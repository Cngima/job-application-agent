# Which profile to run against. "sample" is the fictional demo profile.
profile: sample            # sample | private
data_dir: data/sample      # data/private for Carol's real data

ai:
  provider: claude_code    # claude_code | ollama | anthropic_api | fake
  max_calls_per_run: 60
  batch_size: 5
  timeout_seconds: 180
  claude_code:
    model: null            # null = CLI default
  ollama:
    host: http://localhost:11434
    model: qwen2.5:7b
  anthropic_api:
    model: claude-opus-5-5   # paid API only; effort below
    effort: medium

routing:
  # Targeting and pay floors live in config/search_profile.yaml.
  max_desc_chars: 6000        # description characters sent to the AI per job
  fx_to_usd:                  # approximate rates for the pay-floor estimate; edit as needed
    USD: 1.0
    EUR: 1.08
    GBP: 1.27
    KES: 0.0077
    CAD: 0.73
    AUD: 0.66
    INR: 0.012
    ZAR: 0.055
    PHP: 0.017
    NGN: 0.00065


fit:
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 4
  shortlist_threshold: 70

sourcing:
  max_detail_fetches_per_source: 60   # caps per-job requests on big boards
  max_new_companies_per_run: 15       # resolver board lookups for unseen companies

intake:
  inbox_dir: inbox                 # WhatsApp text files; processed ones move to inbox/processed
  follow_links_per_post: 2         # apply links followed per WhatsApp/manual post
  gmail:
    enabled: false                 # set true after `jobagent gmail auth`
    client_secret: data/private/gmail_client_secret.json
    token: data/private/gmail_token.json
    lookback_days: 7
    max_messages_per_run: 50
    linkedin_senders:              # LinkedIn job alert senders
      - jobalerts-noreply@linkedin.com
      - jobs-noreply@linkedin.com
      - jobs-listings@linkedin.com

http:
  user_agent: "job-application-agent/0.1 (+https://github.com/Cngima/job-application-agent)"
  min_seconds_between_requests: 2.0
  timeout_seconds: 20
