# Targeting for routing and scoring. Edit freely.

titles:
  - AI Project Manager
  - AI Implementation Specialist
  - AI Automation Specialist
  - Workflow Automation Specialist
  - Automation Project Manager
  - Technical Project Manager
  - Implementation Manager
  - Implementation Project Manager
  - AI Operations Specialist
  - Program Coordinator (AI or automation)
  - Project Coordinator (automation or technical)
  - Revenue Operations (automation focus)
  - Marketing Operations (automation focus)

priority_keywords: [AI, automation, agents, Claude, n8n, Make, Zapier, workflow,
  integrations, APIs, HubSpot, client onboarding, implementation]

seniority:
  include: [mid, senior]
  exclude: [intern, internship, entry-level, junior-graduate, director, head of, vp, vice president, chief]

exclude_functions:
  - pure software engineering
  - data science or ML engineering
  - sales, SDR or BDR quota roles
  - call centre or customer support
  - roles requiring a licence Carol does not hold

# Titles containing these words are skipped by the free rules (whole words, any case).
exclude_title_terms: [software engineer, engineer, engineers, developer, developers,
  programmer, data scientist, machine learning, ML engineer, SDR, BDR, account executive,
  sales representative, sales development, sales executive, business development representative,
  customer support agent, customer service, call centre, call center, nurse, physician,
  pharmacist, therapist, attorney, lawyer, accountant, CPA, teacher, tutor, driver]
seniority_exclude: [intern, internship, graduate, trainee, entry level, entry-level,
  director, VP, vice president, head of, chief, CEO, COO, CTO, CFO]

hours:
  accept: [full-time, part-time]
  us_hours_ok: true            # shown in the digest when required
  part_time_bonus: 5           # priority points for part-time or flexible roles

pay:
  floor_usd_month_part_time: 1300
  floor_usd_month_full_time: 1800
  hours_per_month_part_time: 80     # used only when the posting states no hours
  hours_per_month_full_time: 160
  review_band_pct: 10               # converted pay up to 10% below floor -> REVIEW, not SKIP

# Where Carol can work (used by Stage 3 routing). Remote roles are always in scope.
kenya_onsite_ok: false                    # skip fully on-site roles unless set to true
kenya_hybrid_cities: [Nairobi, Nakuru]   # hybrid roles only in these cities

# Postings older than this are dropped at sourcing (before any detail request where the
# board's list gives a date). Undated postings are kept and flagged date_unknown.
max_age_days: 7

# Cheap title screen applied before fetching job details (Stage 2). Deliberately broad:
# Stage 3 makes the real routing decision. Word-boundary, case-insensitive matches.
title_prefilter:
  include: [project, projects, program, programme, implementation, implementations,
    automation, automations, workflow, workflows, AI, operations, ops, RevOps,
    integration, integrations, onboarding, delivery, coordinator, PMO, process, enablement,
    "no-code", "low-code", Zapier, n8n, HubSpot, CRM]
  exclude: [engineer, engineers, developer, developers, scientist, intern, internship,
    graduate, director, VP, "vice president", "head of", chief, "account executive",
    SDR, BDR, "sales representative", "sales development", nurse, teacher, tutor,
    accountant, designer, "call centre", "call center", "customer support",
    "customer service", "support agent", "support specialist"]
